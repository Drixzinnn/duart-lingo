<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duart Lingo – Aprenda espanhol</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#3c3c3c;--mute:#777;--line:#e5e5e5;--green:#58cc02;--gd:#58a700;--blue:#1cb0f6;--bd:#1899d6;--red:#ff4b4b;--rd:#ea2b2b;--gold:#ffc800;--soft:#f7f7f7;--okbg:#d7ffb8;--badbg:#ffdfe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--ink:#eee;--mute:#9aa7ad;--line:#37464f;--soft:#1f2c34;--okbg:#1d3a14;--badbg:#3d1d1f;--gd:#46a302}}
:root[data-theme="dark"]{--bg:#131f24;--ink:#eee;--mute:#9aa7ad;--line:#37464f;--soft:#1f2c34;--okbg:#1d3a14;--badbg:#3d1d1f;--gd:#46a302}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:700 17px/1.4 Nunito,system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;color:var(--green);letter-spacing:-.5px}
.logo img{width:40px;height:40px}
.stats{display:flex;gap:14px;font-weight:900}
.stats span:nth-child(1){color:#ff9600}.stats span:nth-child(2){color:var(--gold)}.stats span:nth-child(3){color:var(--red)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 20px;font-weight:900;font-size:17px;letter-spacing:.8px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--gd);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{background:var(--line);color:var(--mute);box-shadow:0 4px 0 var(--mute);cursor:not-allowed}
.btn.bad{background:var(--red);box-shadow:0 4px 0 var(--rd)}
.btn.ghost{background:var(--bg);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.hero{display:flex;align-items:center;gap:8px;margin:22px 0 8px}
.hero button{border:0;background:none;padding:0;flex:none}
.hero img{width:150px;height:150px;display:block;transition:transform .2s}
.hero button:active img{transform:rotate(-8deg) scale(.96)}
.bubble{position:relative;border:2px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--bg)}
.bubble:before{content:"";position:absolute;left:-10px;top:50%;width:16px;height:16px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
h1{font-size:26px;margin:18px 0 4px;font-weight:900}
.sub{color:var(--mute);margin:0 0 18px}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0}
.node{display:flex;align-items:center;gap:14px;width:100%}
.node:nth-child(even){flex-direction:row-reverse;text-align:right}
.node:nth-child(2){margin-left:0}
.dot{width:84px;height:78px;border-radius:50%;border:0;font-size:34px;background:var(--green);box-shadow:0 7px 0 var(--gd);flex:none;display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.dot:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 var(--gd)}
.dot:disabled{background:var(--line);box-shadow:0 7px 0 var(--mute);filter:grayscale(1);opacity:.7;cursor:not-allowed}
.dot.done{background:var(--gold);box-shadow:0 7px 0 #cc9f00}
.node b{display:block;font-size:19px}.node small{color:var(--mute);font-weight:700}
.lesson{display:flex;flex-direction:column;min-height:100vh;padding-bottom:0}
.top{display:flex;align-items:center;gap:14px;padding:18px 0}
.x{border:0;background:none;font-size:26px;color:var(--mute);padding:4px 8px}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s}
.q{flex:1;padding-top:10px}
.q h2{font-size:25px;margin:6px 0 18px;font-weight:900}
.ask{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.ask img{width:76px;height:76px}
.opts{display:grid;gap:12px}
.opt{text-align:left;border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--bg);box-shadow:0 3px 0 var(--line);font-weight:800}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--bg));box-shadow:0 3px 0 var(--bd)}
.opt.ok{border-color:var(--green);background:var(--okbg)}.opt.no{border-color:var(--red);background:var(--badbg)}
input.txt{width:100%;font:inherit;font-weight:800;font-size:19px;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--soft);color:var(--ink)}
.foot{margin:0 -18px;padding:18px;border-top:2px solid var(--line);position:sticky;bottom:0;background:var(--bg);padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.foot.ok{background:var(--okbg);border-color:var(--okbg)}.foot.bad{background:var(--badbg);border-color:var(--badbg)}
.fb{font-size:19px;font-weight:900;margin-bottom:12px}.foot.ok .fb{color:var(--gd)}.foot.bad .fb{color:var(--red)}
.end{text-align:center;padding-top:40px}.end img{width:200px}
.sum{display:flex;gap:12px;justify-content:center;margin:20px 0 28px}
.sum div{border:2px solid var(--gold);border-radius:16px;padding:10px 20px;min-width:110px;color:var(--gold)}
.sum div.b{border-color:var(--blue);color:var(--blue)}.sum strong{display:block;font-size:26px}
.who{display:flex;justify-content:space-between;align-items:center;padding:10px 0 0;color:var(--mute)}
.out{border:0;background:none;color:var(--blue);font-weight:900;padding:6px 4px}
.tabs{display:flex;max-width:420px;margin:0 auto 16px;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.tab{flex:1;border:0;background:var(--bg);padding:12px;font-weight:900;color:var(--mute)}
.tab.on{background:var(--blue);color:#fff}
.fields{max-width:420px;margin:0 auto;display:grid;gap:12px;text-align:left}
.err{color:var(--red);min-height:1.4em;font-weight:800}
.stu{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.sh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.acts{display:grid;gap:8px;margin-top:10px}.btn.s{padding:10px 14px;font-size:15px}.np{padding:10px 14px;font-size:16px}
.sum{flex-wrap:wrap}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.rank li.me{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--bg))}
.pos{width:34px;text-align:center;font-size:24px;font-weight:900}
.rank .nm{flex:1;overflow-wrap:anywhere}.rank small{display:block;color:var(--mute);font-weight:700}
.rank b{color:var(--gold)}.rk{font-weight:800;margin:-4px 0 12px}
.wc{border:2px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;text-align:center}
.big{font-size:36px;font-weight:900;color:var(--green);overflow-wrap:anywhere}.tr{font-size:22px}
.exs{background:var(--soft);border-radius:14px;padding:12px;display:grid;gap:8px}.exs small{color:var(--mute);font-size:16px}
.spk{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 14px;font-weight:800;color:var(--blue)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tip{background:var(--soft);border-left:6px solid var(--blue);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.cnt{color:var(--mute);margin-bottom:8px}
.sc{border:2px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 4px 0 var(--line)}
.sc .es{font-size:34px;font-weight:900;color:var(--green);overflow-wrap:anywhere}
.sc .pt{font-size:20px;margin:4px 0 10px}.sc .pr{color:var(--mute)}.sc .pr small{display:block;font-size:13px}.sc .pr b{color:var(--ink)}
.sp{display:inline-block;width:auto;margin:12px 0;padding:10px 18px}
.ex{border-top:2px dashed var(--line);margin-top:10px;padding-top:12px}.ex small{display:block;color:var(--mute);font-weight:700}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
.rh{font-size:21px;margin:24px 0 10px}.rs{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:8px}
.rs li{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--line);padding:8px 2px}.rs span{color:var(--mute);text-align:right}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
